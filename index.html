<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raviram Portfolio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            margin-top: 20px;
        }
        h1 {
            margin-top: 20px;
            font-size: 2.2rem;
            color: #ffcc00;
        }
        h2 {
            font-size: 1.2rem;
            color: #cccccc;
            margin-top: -10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="photo.jpg" alt="Raviram" class="profile-img">
        <h1>Raviram</h1>
        <h2>Film Maker & Editor</h2>
    </div>
</body>
</html>
